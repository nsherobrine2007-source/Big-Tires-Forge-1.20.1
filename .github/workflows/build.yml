name: Build Big Tires

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Verificando o projeto..."
          ls -la
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif [ -f build.gradle ]; then
            gradle build --no-daemon
          else
            echo "ERRO: Código-fonte Gradle não encontrado."
            exit 1
          fi

      - name: Salvar arquivos compilados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Big-Tires-build
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
